services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scoring-backend
    restart: unless-stopped
    ports:
      # Loopback saja: klien harus lewat nginx, yang menimpa X-Forwarded-For. Port terbuka ke LAN membuat IP palsu
      # melewati pembatas login/PIN.
      - "127.0.0.1:${PORT:-8080}:8080"
    # Berkas .env.prod WAJIB ada (cp .env.example .env.prod, lalu isi JWT_SECRET dll.): compose berhenti bila
    # tidak ditemukan. Seluruh isinya menjadi environment backend (JWT_SECRET, AUTO_MIGRATE, SEED_DATA, ...).
    # Jalankan selalu dengan:  docker compose --env-file .env.prod up -d --build
    # agar ${VAR} di berkas ini (port, POSTGRES_*) juga dibaca dari .env.prod, bukan dari .env (development).
    # Nilai di `environment` di bawah menimpa .env.prod karena harus berbeda di dalam container.
    env_file:
      - .env.prod
    environment:
      - PORT=8080 # nginx dan pemetaan port menuju 8080 di dalam container
      - ENV=production # jalur Docker = produksi; development memakai `go run` dengan .env
      # .env berisi DB_URL untuk `go run` di host (localhost); di dalam container database bernama `postgres`
      # Password database wajib (POSTGRES_PASSWORD di .env.prod). Pakai hex/base64url (openssl rand -hex 24): karakter
      # seperti @ : / # di password merusak URL ini.
      - DB_URL=postgres://${POSTGRES_USER:-scoring_user}:${POSTGRES_PASSWORD:?set_in_env_file}@postgres:5432/${POSTGRES_DB:-digital_scoring}?sslmode=disable
      # JWT_SECRET sengaja tidak ditulis di sini: nilainya datang dari .env.prod (env_file). Backend menolak
      # start bila kosong, masih nilai contoh, atau < 32 karakter (ENV=production).
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (Vue) + proxy API/WebSocket. Pintu masuk utama: http://<host>:${WEB_PORT:-80}/
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: scoring-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app

  # HTTPS (wajib untuk memasang PWA di tablet). Opsional: docker compose --env-file .env.prod --profile https up -d
  # Petunjuk lengkap: docs/PWA.md. Port 80 dipakai Caddy (tantangan Let's Encrypt + pengalihan ke HTTPS), jadi
  # pindahkan `web` ke loopback di .env.prod:  WEB_PORT=127.0.0.1:8081
  caddy:
    profiles: ["https"]
    build: ./deploy/caddy # caddy:2-alpine + modul DNS Cloudflare (sertifikat lewat tantangan DNS)
    container_name: scoring-https
    # Resolver eksplisit untuk Let's Encrypt dan API Cloudflare: host dengan systemd-resolved/Tailscale MagicDNS
    # bisa mewariskan 127.0.0.53 yang tidak terjangkau dari container. Nama layanan (web) tetap lewat DNS Docker.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost} # isi domain/IP di .env.prod; "localhost" hanya agar compose tetap valid
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
      ACME_DNS: ${ACME_DNS:-} # mis. "acme_dns cloudflare {env.CLOUDFLARE_API_TOKEN}"; kosong = tantangan HTTP biasa
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # sertifikat dan root CA internal: simpan agar tidak diterbitkan ulang
      - caddy_config:/config
    depends_on:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: scoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_scoring}
      POSTGRES_USER: ${POSTGRES_USER:-scoring_user}
      # Password hanya dibaca saat volume postgres_data pertama dibuat. Volume lama yang dibuat dengan `trust` tidak
      # berubah: hapus dulu (`docker compose --env-file .env.prod down -v`, SEMUA DATA HILANG) atau migrasi manual.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_env_file (openssl rand -hex 24)}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      # Loopback saja: database tidak perlu terjangkau dari jaringan; backend memakai jaringan Docker.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ = variabel diperluas di dalam container (nilai POSTGRES_USER/POSTGRES_DB di atas)
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
