services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scoring-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENV=production
      # dirakit dari nilai yang sama dengan layanan postgres (lihat .env.example)
      - DB_URL=postgres://${POSTGRES_USER:-scoring_user}@postgres:5432/${POSTGRES_DB:-digital_scoring}?sslmode=disable
      # ganti lewat berkas .env atau environment host (JWT_SECRET=... docker compose up)
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-secret-key-123}
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (Vue) + proxy API/WebSocket. Pintu masuk utama: http://<host>:${WEB_PORT:-80}/
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: scoring-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: scoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_scoring}
      POSTGRES_USER: ${POSTGRES_USER:-scoring_user}
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ = variabel diperluas di dalam container (nilai POSTGRES_USER/POSTGRES_DB di atas)
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: