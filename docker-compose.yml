services:
  postgres:
    image: postgres:16-alpine
    container_name: scoring-postgres
    environment:
      POSTGRES_DB: digital_scoring
      POSTGRES_USER: scoring_user
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: