openapi: 3.0.3
info:
  title: Pencak Silat Digital Scoring System API
  description: |
    API Backend untuk Digital Scoring Pencak Silat (Kategori Tanding).
    Mendukung Real-Time WebSocket Scoring, Konsensus Juri, Manajemen Gelanggang (Arena),
    Bagan Turnamen (Single Elimination), Kontrak Protokol WebSocket, dan Event Sourcing Audit Trail.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  # -------------------------------------------------------
  # AUTHENTICATION
  # -------------------------------------------------------
  /api/v1/auth/judge-login:
    post:
      summary: Login Tablet Juri / Wasit menggunakan PIN
      description: |
        Login hanya dengan PIN. Turnamen, gelanggang, role, dan kursi ditentukan server dari data PIN
        (setiap PIN unik di seluruh sistem). PIN juri 6 digit, PIN wasit 8 digit. Mengembalikan token JWT
        untuk koneksi WebSocket. Setelah 5 kali PIN salah beruntun dalam 15 menit, IP klien dikunci 15 menit
        (HTTP 429 `TOO_MANY_ATTEMPTS` dengan header `Retry-After`).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: '^[0-9]{6,8}$'
                  example: "123001"
      responses:
        '200':
          description: Login berhasil, token JWT diberikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      role:
                        type: string
                        example: "judge"
                      seat_number:
                        type: integer
                        example: 1
                      arena_id:
                        type: string
                        format: uuid
                      competition_id:
                        type: string
                        format: uuid
        '401':
          description: PIN salah atau kadaluarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Terlalu banyak PIN salah beruntun; IP dikunci sementara (lihat header `Retry-After`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Login Admin / Operator / Dewan menggunakan Email & Password
      description: Mengautentikasi akun admin/operator dan mengembalikan token JWT untuk akses API administratif.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@silat.id"
                password:
                  type: string
                  format: password
                  example: "AdminSecret123!"
      responses:
        '200':
          description: Login berhasil, token JWT diberikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        $ref: '#/components/schemas/Official'
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/contingent/register:
    post:
      summary: Registrasi Akun Manajer Kontingen / Official Tim
      description: Memungkinkan perwakilan kontingen/perguruan mendaftar secara mandiri untuk mengelola pendaftaran atlet mereka.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pic_name, email, phone, password]
              properties:
                name:
                  type: string
                  example: "Tapak Suci Sleman"
                pic_name:
                  type: string
                  example: "Budi Santoso"
                email:
                  type: string
                  format: email
                  example: "tapaksuci@example.com"
                phone:
                  type: string
                  example: "081234567890"
                password:
                  type: string
                  format: password
                  example: "Secret123!"
      responses:
        '201':
          description: Kontingen berhasil terdaftar
        '400':
          description: Validasi gagal atau email sudah terdaftar

  /api/v1/auth/contingent/login:
    post:
      summary: Login Manajer Kontingen
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "tapaksuci@example.com"
                password:
                  type: string
                  format: password
                  example: "Secret123!"
      responses:
        '200':
          description: Login berhasil, token JWT role 'contingent' dikembalikan
        '401':
          description: Email atau password salah

  /api/v1/auth/logout:
    post:
      summary: Logout Sesi Pengguna
      description: Konfirmasi logout dari server. Pada arsitektur Stateless JWT, klien wajib menghapus token dari storage lokal.
      tags:
        - Authentication
      responses:
        '200':
          description: Berhasil logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "OK"
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "successfully logged out"

  /api/v1/auth/create-pin:
    post:
      summary: Generate PIN Baru untuk Petugas Pertandingan (Admin / Dewan)
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competition_id, arena_id, role]
              properties:
                competition_id:
                  type: string
                  format: uuid
                arena_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [judge, referee, admin, dewan, operator, judge_1, judge_2, judge_3]
                  example: "judge"
                seat_number:
                  type: integer
                  description: Optional. Nomor kursi juri di gelanggang (1, 2, 3, dst).
                  example: 1
                pin:
                  type: string
                  description: Optional. Jika tidak diisi, server membuat PIN acak yang unik (6 digit; 8 digit untuk role wasit). PIN kustom harus berupa angka dengan panjang sesuai role dan unik di seluruh sistem; bila bentrok server menjawab HTTP 409 `PIN_TAKEN`.
                  example: "839201"
                ttl_hours:
                  type: integer
                  default: 12
                  example: 12
      responses:
        '200':
          description: PIN berhasil dibuat (mengembalikan plaintext PIN yang di-generate server dan masa berlaku)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      competition_id:
                        type: string
                        format: uuid
                      arena_id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        example: "judge"
                      seat_number:
                        type: integer
                        example: 1
                      pin:
                        type: string
                        example: "839201"
                      expires_at:
                        type: string
                        format: date-time
        '403':
          description: Forbidden (Hanya admin/dewan yang diizinkan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/pins:
    get:
      summary: Mengambil Daftar PIN Aktif per Gelanggang (Admin / Dewan)
      description: Mengambil seluruh PIN aktif untuk gelanggang tertentu secara sinkron dari database. Jika arena belum memiliki PIN, server akan otomatis men-generate PIN awal untuk 5 Juri dan 1 Wasit.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: competition_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID kompetisi yang aktif
        - name: arena_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID gelanggang yang dipilih
      responses:
        '200':
          description: Daftar PIN juri dan wasit aktif berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        competition_id:
                          type: string
                          format: uuid
                        arena_id:
                          type: string
                          format: uuid
                        role:
                          type: string
                          example: "judge"
                        seat_number:
                          type: integer
                          example: 1
                        pin:
                          type: string
                          example: "703351"
                        expires_at:
                          type: string
                          format: date-time
        '400':
          description: Bad Request (competition_id atau arena_id tidak disertakan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Hanya admin atau dewan yang berwenang)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------
  # COMPETITIONS
  # -------------------------------------------------------
  /api/v1/competitions:
    get:
      summary: Daftar Seluruh Kejuaraan (Mendukung Pagination & Filter Status)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Nomor halaman (dimulai dari 1)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Jumlah data per halaman (maksimal 100)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, ongoing, completed]
          description: Filter berdasarkan status kompetisi
      responses:
        '200':
          description: List kompetisi berhasil diambil beserta metadata pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: "Kejuaraan Nasional Silat 2026"
                        location:
                          type: string
                          example: "Jakarta"
                        status:
                          type: string
                          example: "ongoing"
                        ruleset_name:
                          type: string
                          example: "IPSI 2024"
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Buat Kejuaraan Baru (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location, start_date, end_date, ruleset_name]
              properties:
                name:
                  type: string
                  example: "Kejuaraan Nasional Silat 2026"
                location:
                  type: string
                  example: "Jakarta"
                start_date:
                  type: string
                  format: date
                  example: "2026-10-01"
                end_date:
                  type: string
                  format: date
                  example: "2026-10-05"
                ruleset_name:
                  type: string
                  example: "IPSI 2024"
                ruleset_id:
                  type: string
                  format: uuid
                  description: |
                    Ruleset dari `GET /api/v1/rulesets` yang dipakai partai kejuaraan ini. Bila diisi, ruleset ini
                    dipakai saat partai dimuat ke gelanggang; bila kosong, server mencocokkan `ruleset_name`
                    (nama lengkap, atau kata pertama seperti `ipsi`) dengan ruleset basis data, lalu berkas/bawaan.
      responses:
        '201':
          description: Kompetisi dibuat

  /api/v1/competitions/{id}:
    get:
      summary: Detail Kejuaraan
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail kompetisi
    put:
      summary: Perbarui Data Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Kejuaraan Nasional Silat Edisi Khusus 2026"
                location:
                  type: string
                  example: "Bandung"
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                ruleset_name:
                  type: string
                ruleset_id:
                  type: string
                  format: uuid
                  description: Ganti ruleset kejuaraan (satu kejuaraan = satu ruleset). String kosong melepas ruleset. Ditolak 409 bila sudah ada partai berjalan/selesai.
      responses:
        '200':
          description: Data kompetisi berhasil diperbarui
        '409':
          description: Ruleset tidak dapat diganti karena sudah ada pertandingan yang berjalan atau selesai.

  /api/v1/competitions/{id}/activate:
    put:
      summary: Aktifkan Status Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi active

  /api/v1/competitions/{id}/pause:
    post:
      summary: Jeda Status Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi paused

  /api/v1/competitions/{id}/finish:
    post:
      summary: Selesaikan Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi completed

  /api/v1/competitions/{id}/cancel:
    post:
      summary: Batalkan Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi cancelled

  # -------------------------------------------------------
  # CATEGORIES
  # -------------------------------------------------------
  /api/v1/competitions/{comp_id}/categories:
    get:
      summary: Daftar Kategori Pertandingan pada Kompetisi
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List kategori tanding
    post:
      summary: Tambah Kategori Pertandingan Baru (Admin / Dewan)
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gender, weight_class]
              properties:
                name:
                  type: string
                  example: "Tanding Putra Kelas A"
                gender:
                  type: string
                  enum: [male, female]
                  example: "male"
                weight_class:
                  type: string
                  example: "A"
                ruleset_id:
                  type: string
                  format: uuid
                age_group:
                  type: string
                  default: dewasa
                  description: |
                    Golongan umur. Standar `ipsi`: pra_usia_dini, usia_dini_1, usia_dini_2, pra_remaja,
                    remaja, dewasa, master_a (36-45), master_b (46+). Standar `persilat_2026`: singa, macan,
                    pre_teen, pra_remaja, remaja, dewasa (17-45), master_a (46-60), master_b (61+).
                  example: "usia_dini_2"
                preset_standard:
                  type: string
                  enum: [ipsi, persilat_2026]
                  default: ipsi
                min_weight:
                  type: number
                  nullable: true
                  description: Batas bobot bawah (kg, inklusif). Kosong = tanpa batas.
                  example: 26
                max_weight:
                  type: number
                  nullable: true
                  description: Batas bobot atas (kg, inklusif). Kosong = tanpa batas.
                  example: 28
                bracket_mode:
                  type: string
                  enum: [single_elimination, pemasalan_4]
                  default: single_elimination
                  description: "`pemasalan_4` = mini-bracket maks. 4 peserta; pilihan manual panitia (tidak ada di regulasi, yang memakai sistem gugur)."
      responses:
        '201':
          description: Kategori tanding berhasil dibuat
        '409':
          description: Kejuaraan sudah memakai standar lain (satu kejuaraan hanya satu standar, PB IPSI atau PERSILAT 2026). Reset kategori terlebih dahulu.
    delete:
      summary: Reset Seluruh Kategori Kejuaraan (Admin / Dewan) — untuk mengganti standar
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Kategori (dan slot bagan terkait) dihapus; mengembalikan jumlah `deleted`.
        '409':
          description: Masih ada peserta terdaftar pada kategori; reset ditolak.

  /api/v1/competitions/{comp_id}/categories/ruleset:
    put:
      summary: Tetapkan Ruleset Khusus per Golongan Umur / Kategori (Admin / Dewan)
      description: |
        Ruleset khusus kategori menimpa ruleset kejuaraan untuk partai pada kategori tersebut
        (mis. Usia Dini 2 babak × 1,5 menit, sedangkan golongan lain tetap 3 babak × 2 menit).
        `ruleset_id: null` mengembalikan ke ruleset kejuaraan. Ditolak 409 bila kategori yang
        terdampak sudah punya partai berjalan/selesai.
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    description: Isi tepat satu dari `age_group` atau `category_id`.
                    properties:
                      age_group:
                        type: string
                        example: usia_dini_2
                      category_id:
                        type: string
                        format: uuid
                      ruleset_id:
                        type: string
                        format: uuid
                        nullable: true
      responses:
        '200':
          description: Jumlah kategori yang diperbarui (`updated`).
        '400':
          description: Ruleset tidak ditemukan / pemilih tidak valid.
        '409':
          description: Sudah ada pertandingan yang berjalan atau selesai pada kategori terdampak.

  /api/v1/competitions/{comp_id}/categories/{id}:
    get:
      summary: Detail Kategori Pertandingan
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail kategori pertandingan

  # -------------------------------------------------------
  # ATHLETES & PARTICIPANTS
  # -------------------------------------------------------
  /api/v1/athletes:
    get:
      summary: Daftar Master Seluruh Atlet (Mendukung Pagination & Filter Gender). Hanya admin/dewan; memuat tanggal lahir & NIK
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Nomor halaman (dimulai dari 1)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Jumlah data per halaman (maksimal 100)
        - name: gender
          in: query
          required: false
          schema:
            type: string
            enum: [male, female]
          description: Filter berdasarkan gender atlet
      responses:
        '200':
          description: List seluruh atlet berhasil diambil beserta metadata pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: "Budi Santoso"
                        gender:
                          type: string
                          example: "male"
                        team:
                          type: string
                          example: "Jawa Barat"
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Tambah Master Atlet Baru (Admin / Dewan)
      tags:
        - Athlete
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gender, team]
              properties:
                name:
                  type: string
                  example: "Budi Santoso"
                gender:
                  type: string
                  enum: [male, female]
                  example: "male"
                team:
                  type: string
                  example: "Jawa Barat"
      responses:
        '201':
          description: Atlet berhasil ditambahkan

  /api/v1/athletes/{id}:
    get:
      summary: Detail Data Atlet
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail data atlet
    put:
      summary: Lengkapi / Perbaiki Tanggal Lahir & NIK Atlet
      description: |
        Mengisi tanggal lahir (`YYYY-MM-DD`, tidak boleh di masa depan) dan/atau NIK (maks. 50 karakter);
        field yang tidak dikirim tidak diubah. Dipakai untuk data lama yang belum punya tanggal lahir atau
        salah ketik, agar golongan umur bisa diperiksa (lihat `age_check` pada daftar peserta).
        Peran: admin/dewan (semua atlet) dan contingent (hanya atlet miliknya; selain itu `404`).
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                birth_date:
                  type: string
                  example: '1998-03-12'
                nik:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: Data atlet terbaru
        '400':
          description: Tanggal lahir tidak valid / body kosong / NIK terlalu panjang
        '404':
