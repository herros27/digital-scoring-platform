          description: Pertandingan dilanjutkan (status running)

  /api/v1/competitions/{comp_id}/matches/{id}/finish:
    post:
      summary: Selesaikan Pertandingan & Hitung Pemenang (Admin / Dewan / Wasit)
      description: |
        Pemenang dihitung dari skor bersih (poin teknik dikurangi sanksi). Bila skor **seri**, server menolak
        dengan 400 `TIE_NEEDS_DECISION` kecuali body menyertakan `winner` (keputusan wasit; `result_type`
        menjadi `referee_decision`).
      tags:
        - Match Lifecycle
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                winner:
                  type: string
                  enum: [red, blue]
                  description: Pemenang menurut keputusan wasit (wajib bila skor seri)
      responses:
        '200':
          description: Pertandingan selesai dan pemenang ditentukan (status finished)
        '400':
          description: Status tidak valid, atau skor seri tanpa `winner` (`TIE_NEEDS_DECISION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/competitions/{comp_id}/matches/{id}/cancel:
    post:
      summary: Batalkan Pertandingan (Admin / Dewan / Wasit)
      tags:
        - Match Lifecycle
      security:
