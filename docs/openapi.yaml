    get:
      summary: Kejuaraan Aktif untuk Bagan Publik (Publik)
      description: |
        Daftar kejuaraan berstatus `active`. Tanpa login. Dipakai halaman `/bagan`. Kejuaraan draft,
        paused, finished, atau cancelled tidak ditampilkan. Di-cache 10 detik dan dibersihkan saat status berubah.
      tags:
        - Public Bracket
      responses:
