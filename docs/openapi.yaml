            type: string
            format: uuid
      responses:
        '200':
          description: Pertandingan dilanjutkan (status running)

  /api/v1/competitions/{comp_id}/matches/{id}/finish:
    post:
      summary: Selesaikan Pertandingan & Hitung Pemenang (Admin / Dewan / Wasit)
      description: |
        Pemenang dihitung dari skor bersih (poin teknik dikurangi sanksi). Bila skor **seri**, server menjalankan
        aturan seri ruleset (`tiebreak.steps`): potongan sanksi paling sedikit, lalu teknik terbanyak menurut
        `technique_priority` (mis. Tangkapan+Jatuhan, Jatuhan, Tendangan, Pukulan); `result_type` menjadi
        `tiebreak_penalties` atau `tiebreak_technique`. Bila semua langkah otomatis masih seri, server menolak dengan
        400 `TIE_NEEDS_DECISION` kecuali body menyertakan `winner` (keputusan manual; `method` menentukan dasar
        keputusan dan `result_type`: `referee_decision` bila kosong, atau `tiebreak_extra_round`,
        `tiebreak_lighter_weight`, `tiebreak_coin_toss`).

        Partai yang **belum dimulai** (state `idle`) tidak dapat diselesaikan: 400 `INVALID_STATE_TRANSITION`.
        Untuk WO/undur diri sebelum mulai gunakan `/outcome`; untuk membatalkan gunakan `/cancel`.
        Penutupan partai menyiarkan `state_change` (`finished`, timer berhenti) lalu `match_result` ke semua perangkat.
      tags:
        - Match Lifecycle
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                winner:
                  type: string
                  enum: [red, blue]
                  description: Pemenang menurut keputusan wasit (wajib bila seri dan aturan seri otomatis tidak menemukan pemenang)
                method:
                  type: string
                  enum: [referee_decision, extra_round, lighter_weight, coin_toss]
                  description: Dasar keputusan manual. Selain `referee_decision`, harus ada pada `tiebreak.manual_methods` ruleset.
      responses:
        '200':
          description: Pertandingan selesai dan pemenang ditentukan (status finished)
        '400':
          description: Status tidak valid, atau skor seri tanpa `winner` (`TIE_NEEDS_DECISION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/competitions/{comp_id}/matches/{id}/outcome:
    post:
      summary: Nyatakan Hasil Khusus KO / TKO / WO / Undur Diri (Admin / Dewan / Wasit)
      description: |
        Mengakhiri partai dengan hasil di luar skor. `winner` adalah sudut yang MENANG; `result_type` hasil
        pertandingan menjadi jenis hasil (`ko`, `tko`, `walkover`, `withdrawal`). Kapan tiap jenis boleh dinyatakan
        diatur `outcomes[].phase` pada ruleset (bawaan: `ko`/`tko` setelah dimulai, `walkover` sebelum dimulai,
        `withdrawal` kapan saja). Partai yang sudah selesai ditolak. Pemenang dimajukan di bagan seperti hasil lain.
      tags:
        - Match Lifecycle
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, winner]
              properties:
                outcome: { type: string, enum: [ko, tko, walkover, withdrawal] }
                winner: { type: string, enum: [red, blue] }
                note: { type: string, maxLength: 200, example: "Lawan tidak hadir setelah 3x panggilan" }
      responses:
        '200':
          description: Partai selesai dengan hasil khusus
        '400':
          description: Jenis hasil tidak tersedia pada ruleset, fase tidak sesuai, atau partai sudah selesai (`INVALID_STATE_TRANSITION`)

  /api/v1/competitions/{comp_id}/matches/{id}/reschedule:
    post:
      summary: Jadwalkan Ulang Partai yang Dibatalkan (Admin / Dewan / Wasit)
      description: |
        Mengembalikan partai berstatus `cancelled` ke `idle` dan menghapus skor per ronde, sehingga partai bisa
        dimuat ke gelanggang lagi dan diulang dari 0-0. Log kejadian percobaan lama tetap tersimpan untuk audit
        tetapi tidak lagi ditampilkan oleh `GET .../events` (disaring sejak kejadian `match_rescheduled` terakhir).
      tags:
        - Match Lifecycle
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partai kembali `idle`
        '400':
          description: Partai tidak berstatus cancelled, atau masih aktif di gelanggang (`INVALID_STATE_TRANSITION`)
        '404':
          description: Partai tidak ditemukan

  /api/v1/competitions/{comp_id}/matches/{id}/cancel:
    post:
      summary: Batalkan Pertandingan (Admin / Dewan / Wasit)
      tags:
        - Match Lifecycle
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
