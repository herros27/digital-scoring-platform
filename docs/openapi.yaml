  /api/v1/competitions/{comp_id}/matches/{id}/load-arena:
    post:
      summary: Muat dan Aktifkan Match ke Arena Tertentu (Admin / Dewan / Wasit)
      description: |
        Menginisialisasi Match Orchestrator, Rules Engine, Timer, dan mengubah status match menjadi READY.
        Jika arena sedang aktif menjalankan pertandingan lain, akan mengembalikan error 409 ARENA_BUSY.
      tags:
        - Match
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arena_id]
              properties:
                arena_id:
                  type: string
                  format: uuid
                ruleset_path:
                  type: string
                  default: "ipsi"
                  example: "ipsi"
      responses:
        '200':
          description: Match siap di arena
        '409':
          description: Arena sedang dipakai oleh pertandingan lain yang aktif (ARENA_BUSY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/competitions/{comp_id}/matches/{id}/start:
    post:
      summary: Mulai Pertandingan / Ronde (Admin / Dewan / Wasit)
