                    $ref: '#/components/schemas/CompetitionExport'

  # -------------------------------------------------------
  # LIVE SCOREBOARD (PUBLIC)
  # -------------------------------------------------------
  /api/v1/live/scoreboard/{arena_id}:
    get:
      summary: Live Scoreboard Feed (Publik / Layar Penonton)
      tags:
        - Live Scoreboard
      parameters:
        - name: arena_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            Keadaan pertandingan yang sedang aktif di gelanggang (dibaca dari orchestrator di memori),
            atau `{"status": "no active match"}` bila belum ada pertandingan yang dimuat / sudah selesai.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Status mesin pertandingan (`ready`, `round_1`, `break_1`, ...) atau `no active match`
                        example: round_1
                      match_id:
                        type: string
                        format: uuid
                      arena_id:
                        type: string
                        format: uuid
                      round:
                        type: integer
                      timer_remaining_ms:
                        type: integer
                      timer_running:
                        type: boolean
                      red_total:
                        type: integer
                      blue_total:
                        type: integer
                      red_athlete:
                        type: string
                      blue_athlete:
                        type: string

  # -------------------------------------------------------
  # WEBSOCKET REAL-TIME CHANNEL & PROTOCOL
  # -------------------------------------------------------
  /ws/arena/{arena_id}:
    get:
      summary: Real-Time WebSocket Channel Arena
      description: |
        Endpoint WebSocket dua arah untuk sinkronisasi live match, scoring konsensus juri, kontrol wasit, dan timer.
        
        **Autentikasi** (Query Param `?token=<JWT_TOKEN>`):
        * **Tanpa token** — penonton publik (layar scoreboard TV), role `scoreboard`. Hanya menerima siaran dan
          boleh mengirim `sync_request`; perintah lain dijawab `error` `FORBIDDEN`. Hanya bisa terhubung ke
          gelanggang yang punya pertandingan aktif (hub dibuat saat `load-arena`); selain itu HTTP 404.
        * **Token PIN** (`/auth/judge-login`, login hanya dengan PIN) — terikat satu gelanggang; `arena_id` pada token harus sama dengan
          path, bila tidak HTTP 403. Role `judge` boleh mengirim `judge_input`; role `wasit` dipetakan menjadi
          `referee` dan boleh mengontrol pertandingan.
        * **Token login email** (`/auth/login`, tanpa arena) — hanya role `admin`, `dewan`, dan `wasit`,
          dan boleh terhubung ke gelanggang mana pun.
        
        ---
        ### 📡 Kontrak Pesan WebSocket (Protocol Contract):
        
        #### 1. Client ➔ Server
        * **Input Penilaian Juri (`judge_input`)** — hanya role `judge`:
          ```json
          {
            "type": "judge_input",
            "payload": {
              "event_id": "uuid (kunci idempotensi)",
              "score_type": "technique",
              "target": "red",
              "round": 1
            }
          }
          ```
          * `score_type`: `technique` (+1), `knockdown` (+2), `fall` (+2/3)
          * `target`: `red` atau `blue`

        * **Perintah Wasit / Kontrol Laga (`state_change`)** — hanya `referee` (wasit/dewan) dan `admin`:
          ```json
          {
            "type": "state_change",
            "payload": {
              "action": "start"
            }
          }
          ```
          * `action`: `start`, `pause`, `resume`, `finish`, `cancel`
          * `finish` pada skor seri ditolak (`INVALID_STATE_TRANSITION`) kecuali menyertakan `"winner": "red"|"blue"`
            (keputusan wasit). Waktu habis di ronde terakhir dengan skor seri tidak mengakhiri pertandingan:
            `state_change` membawa `tie_pending: true` sampai wasit memutuskan.
          * `disqualify` + `"target": "red"|"blue"` — sudut itu didiskualifikasi, lawan menang (`result_type`
            `disqualification`), pertandingan berakhir.
          * `adjust_time` + `"delta_ms"` (+/-) — koreksi sisa waktu ronde (dibatasi 1 detik s/d durasi ronde);
            hanya saat berada di dalam ronde.
          * `reset_round` — kembalikan sisa waktu ronde ke durasi penuh; hanya saat dijeda.

        * **Sanksi (`penalty`)** — hanya `referee`/`admin`, hanya saat pertandingan berlangsung. Poin potongan
          ditentukan server dari katalog (`penalty_catalog` pada `sync_response`), klien hanya mengirim jenisnya.
          Setiap jenis hanya boleh dijatuhkan sekali per sudut (`PENALTY_ALREADY_APPLIED`):
          ```json
          {
            "type": "penalty",
            "payload": {
              "target": "blue",
              "type": "teguran_1"
            }
          }
          ```
          Jenis bawaan: `binaan_1` (0), `binaan_2` (0), `teguran_1` (-1), `teguran_2` (-1), `peringatan_1` (-5),
          `peringatan_2` (-10).

        * **Batalkan Sanksi Terakhir (`penalty_revoke`)** — mengembalikan poin sanksi terakhir pada sudut itu:
          ```json
          { "type": "penalty_revoke", "payload": { "target": "blue" } }
          ```

        * **Sinyal Arena (`arena_signal`)** — hanya `referee`/`admin`:
          ```json
          { "type": "arena_signal", "payload": { "signal": "gong" } }
          { "type": "arena_signal", "payload": { "signal": "medic", "active": true } }
          { "type": "arena_signal", "payload": { "signal": "var", "active": false } }
          ```
          `gong` sesaat (disiarkan ke semua klien); `medic` dan `var` memiliki status aktif/nonaktif yang tersimpan
          di server dan tampil sebagai banner pada layar scoreboard.

        * **Sinkronisasi Reconnect (`sync_request`)**:
          ```json
          {
            "type": "sync_request"
          }
          ```

        #### 2. Server ➔ Client (Broadcast)
        * **Balasan Sinkronisasi Status Pertandingan (`sync_response`)**:
          ```json
          {
            "type": "sync_response",
            "payload": {
              "match_id": "uuid",
              "arena_id": "uuid",
              "state": "round_2",
              "round": 2,
              "timer_remaining_ms": 75000,
              "timer_running": true,
              "scores": [
                {"RedTechnical": 3, "BlueTechnical": 2, "RedPenalties": 0, "BluePenalties": 0},
                {"RedTechnical": 1, "BlueTechnical": 4, "RedPenalties": 0, "BluePenalties": 1}
              ],
              "red_total": 4,
              "blue_total": 5,
              "server_time": "2026-10-04T06:30:00Z",
              "ruleset_name": "IPSI 2024",
              "round_duration_ms": 120000,
              "break_duration_ms": 60000,
              "total_rounds": 3,
              "penalties": [
                {"id": 1, "round": 1, "target": "red", "type": "teguran_1", "label": "Teguran 1", "points": 1, "clock_ms": 98000}
              ],
              "penalty_catalog": [{"type": "teguran_1", "label": "Teguran 1", "points": 1}],
              "medic_active": false,
              "var_active": false,
              "tie_pending": false,
              "result": null,
              "presence": {
                "judges": [{"seat": 1, "connected": true, "inputs": 3, "last_input": {"score_type": "technique", "target": "red", "round": 1, "clock_ms": 98000, "at": "2026-10-04T06:29:55Z"}}],
                "referees": 1, "admins": 0, "scoreboards": 1
              }
            }
          }
          ```
          Bidang meja wasit (`ruleset_name` dst.) juga ada pada `GET /api/v1/live/scoreboard/{arena_id}`.
        * **Status & Timer Pertandingan (`state_change`)**: dikirim setiap start/pause/resume/finish/cancel
          dan pergantian ronde. Saat dijeda, `state` tetap `round_N` dan `timer_running` bernilai `false`.
          ```json
          {
            "type": "state_change",
            "payload": {
              "state": "round_1",
              "round": 1,
              "timer_remaining_ms": 118000,
              "timer_running": true,
              "tie_pending": false
            }
          }
          ```
        * **Daftar Sanksi (`penalties`)**: disiarkan ke semua klien setiap sanksi dijatuhkan/dibatalkan —
          `{"penalties": [{"id", "round", "target", "type", "label", "points", "clock_ms"}]}`.
        * **Sinyal Arena (`arena_signal`)**: `{"signal": "gong"|"medic"|"var", "active": true}`.
        * **Kehadiran Perangkat (`presence`)** — hanya ke meja wasit/admin, saat perangkat terhubung/terputus atau
          juri mengirim input: `{"judges": [{"seat", "connected", "inputs", "last_input"}], "referees", "admins", "scoreboards"}`.
        * **Log Kejadian (`match_event`)** — hanya ke meja wasit/admin; sama dengan baris `GET .../matches/{id}/events`
          (`payload` sudah berupa objek, selalu memuat `clock_ms` dan `round`):
          `{"id", "match_id", "event_type", "payload", "judge_id", "created_at"}`.
          Jenis: `match_started`, `match_paused`, `match_resumed`, `match_finished`, `match_cancelled`, `round_started`,
          `round_ended`, `judge_input`, `score_confirmed`, `penalty_applied`, `penalty_revoked`, `disqualified`,
          `referee_decision`, `tie_pending`, `time_adjusted`, `round_reset`, `arena_signal`.
        * **Update Skor Resmi (`score_update`)**:
          ```json
          {
            "type": "score_update",
            "payload": {
              "round": 1,
              "red_technical": 3,
              "blue_technical": 1,
              "red_penalties": 0,
              "blue_penalties": 1
            }
          }
          ```
        * **Notifikasi Poin Sah Masuk (`score_confirmed`)**:
          ```json
          {
            "type": "score_confirmed",
            "payload": {
              "score_type": "technique",
              "target": "red",
              "points": 1,
              "count": 2,
              "round": 1
            }
          }
          ```
        * **Hasil Akhir Pertandingan (`match_result`)**:
          ```json
          {
            "type": "match_result",
            "payload": {
              "winner": "uuid peserta pemenang",
              "corner": "red",
              "result_type": "point_win",
              "scores": [...]
            }
          }
          ```
        * **Pesan Error Server (`error`)**:
          ```json
          {
            "type": "error",
            "payload": {
              "code": "INVALID_STATE_TRANSITION",
              "message": "cannot pause match in ready state"
            }
          }
          ```
      tags:
        - WebSocket Real-Time
      parameters:
        - name: arena_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          description: JWT Token yang didapatkan dari POST /api/v1/auth/judge-login
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols to WebSocket

# -------------------------------------------------------
# COMPONENTS & SCHEMAS
# -------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT yang dihasilkan dari login PIN atau admin auth

  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "ARENA_BUSY"
            message:
              type: string
              example: "arena is currently assigned to another active match"
            details:
              nullable: true

    MatchScoreDetail:
      type: object
      properties:
        match_id:
          type: string
          format: uuid
        total_red:
          type: integer
          example: 12
        total_blue:
          type: integer
          example: 9
        consensus:
          type: object
          properties:
            red_score:
              type: integer
              example: 12
            blue_score:
              type: integer
              example: 9
        judges:
          type: array
          items:
            type: object
            properties:
              judge_id:
                type: string
                format: uuid
              role:
                type: string
                example: "judge"
              seat_number:
                type: integer
                example: 1
              connected:
                type: boolean
                example: true
              red_score:
                type: integer
                example: 12
              blue_score:
                type: integer
                example: 9
        rounds:
          type: array
          items:
            type: object
            properties:
              round:
                type: integer
                example: 1
              athlete_red_score:
                type: integer
                example: 4
              athlete_blue_score:
                type: integer
                example: 3
              red_penalties:
                type: integer
                example: 0
              blue_penalties:
                type: integer
                example: 0
              updated_at:
                type: string
                format: date-time

    MatchEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        event_type:
          type: string
          example: "match_started"
        payload:
          type: string
          example: "{\"round\":1}"
        judge_id:
          type: string
          example: "judge-1"
        created_at:
          type: string
          format: date-time

    Ruleset:
      type: object
      properties:
        id:
          type: string
          example: "ipsi-2024"
        name:
          type: string
          example: "IPSI 2024"
        version:
          type: string
          example: "2024.1"
        scoring:
          type: object
          description: Konfigurasi poin teknik, bantingan, durasi ronde, dan batas penalti
        status:
          type: string
          example: "active"
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45

    Official:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Admin Silat"
        email:
          type: string
          format: email
          example: "admin@silat.id"
        role:
          type: string
          enum: [admin, dewan, operator, wasit]
          example: "admin"
        created_at:
          type: string
          format: date-time

    CompetitionSummary:
      type: object
      properties:
        competition_id:
          type: string
          format: uuid
        competition_name:
          type: string
          example: "Kejurnas Pencak Silat 2026"
        total_arenas:
          type: integer
          example: 3
        total_categories:
          type: integer
          example: 8
        total_athletes:
          type: integer
          example: 64
        total_matches:
          type: integer
          example: 32
        matches_by_status:
          type: object
          additionalProperties:
            type: integer
          example:
            completed: 20
            running: 2
            idle: 10

    MedalStanding:
      type: object
      properties:
        team:
          type: string
          example: "Kontingen Jatim"
        gold:
          type: integer
          example: 5
        silver:
          type: integer
          example: 3
        bronze:
          type: integer
          example: 2
        total:
          type: integer
          example: 10

    CompetitionExport:
      type: object
      properties:
        competition:
          $ref: '#/components/schemas/Competition'
        summary:
          $ref: '#/components/schemas/CompetitionSummary'
        medals:
          type: array
          items:
            $ref: '#/components/schemas/MedalStanding'
        categories:
          type: array
          items:
            type: object
        matches:
          type: array
          items:
            type: object