  # -------------------------------------------------------
  # WEBSOCKET REAL-TIME CHANNEL & PROTOCOL
  # -------------------------------------------------------
  /ws/arena/{arena_id}:
    get:
      summary: Real-Time WebSocket Channel Arena
      description: |
        Endpoint WebSocket dua arah untuk sinkronisasi live match, scoring konsensus juri, kontrol wasit, dan timer.
        
        **Autentikasi**: Menggunakan Query Param `?token=<JWT_TOKEN>`.
        
        ---
        ### 📡 Kontrak Pesan WebSocket (Protocol Contract):
        
        #### 1. Client ➔ Server
        * **Input Penilaian Juri (`score_event`)**:
          ```json
          {
            "type": "score_event",
            "payload": {
              "score_type": "technique",
              "target": "red",
              "round": 1
            }
          }
          ```
          * `score_type`: `technique` (+1), `knockdown` (+2), `fall` (+2/3)
          * `target`: `red` atau `blue`
        
        * **Perintah Wasit / Kontrol Laga (`referee_command`)**:
          ```json
          {
            "type": "referee_command",
            "payload": {
              "action": "start"
            }
          }
          ```
          * `action`: `start`, `pause`, `resume`, `finish`, `cancel`
          
        * **Pemberian Peringatan / Hukuman (`penalty_event`)**:
          ```json
          {
            "type": "penalty_event",
            "payload": {
              "target": "blue",
              "penalty_type": "warning",
              "round": 1
            }
          }
          ```

        * **Sinkronisasi Reconnect (`sync_request`)**:
          ```json
          {
            "type": "sync_request"
          }
          ```

        #### 2. Server ➔ Client (Broadcast)
        * **Balasan Sinkronisasi Status Pertandingan (`sync_response`)**:
          ```json
          {
            "type": "sync_response",
            "payload": {
              "match_id": "uuid",
              "arena_id": "uuid",
              "state": "round_2",
              "round": 2,
              "timer_remaining_ms": 75000,
              "timer_running": true,
              "scores": [
                {"RedTechnical": 3, "BlueTechnical": 2, "RedPenalties": 0, "BluePenalties": 0},
                {"RedTechnical": 1, "BlueTechnical": 4, "RedPenalties": 0, "BluePenalties": 1}
              ],
              "red_total": 4,
              "blue_total": 5,
              "server_time": "2026-10-04T06:30:00Z"
            }
          }
          ```
        * **Status & Timer Pertandingan (`state_change`)**:
          ```json
          {
            "type": "state_change",
            "payload": {
              "match_id": "uuid",
              "status": "round_1",
              "round": 1,
              "remaining_ms": 118000
            }
          }
          ```
        * **Update Skor Resmi (`score_update`)**:
          ```json
          {
            "type": "score_update",
            "payload": {
              "round": 1,
              "red_technical": 3,
              "blue_technical": 1,
              "red_penalties": 0,
              "blue_penalties": 1
            }
          }
          ```
        * **Notifikasi Poin Sah Masuk (`score_confirmed`)**:
          ```json
          {
            "type": "score_confirmed",
            "payload": {
              "score_type": "technique",
              "target": "red",
              "points": 1,
              "count": 2,
              "round": 1
            }
          }
          ```
        * **Hasil Akhir Pertandingan (`match_result`)**:
          ```json
          {
            "type": "match_result",
            "payload": {
              "winner": "red",
              "result_type": "point_win",
              "scores": [...]
            }
          }
          ```
        * **Pesan Error Server (`error`)**:
          ```json
          {
            "type": "error",
            "payload": {
              "code": "INVALID_STATE_TRANSITION",
              "message": "cannot pause match in ready state"
            }
          }
          ```
      tags:
        - WebSocket Real-Time
      parameters:
        - name: arena_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          description: JWT Token yang didapatkan dari POST /api/v1/auth/judge-login
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols to WebSocket

# -------------------------------------------------------
# COMPONENTS & SCHEMAS
# -------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT yang dihasilkan dari login PIN atau admin auth

  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "ARENA_BUSY"
            message:
              type: string
              example: "arena is currently assigned to another active match"
            details:
              nullable: true

    MatchScoreDetail:
      type: object
      properties:
        match_id:
          type: string
          format: uuid
        total_red:
          type: integer
          example: 12
        total_blue:
          type: integer
          example: 9
        rounds:
          type: array
          items:
            type: object
            properties:
              round:
                type: integer
                example: 1
              athlete_red_score:
                type: integer
                example: 4
              athlete_blue_score:
                type: integer
                example: 3
              red_penalties:
                type: integer
                example: 0
              blue_penalties:
                type: integer
                example: 0
              updated_at:
                type: string
                format: date-time

    MatchEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        event_type:
          type: string
          example: "match_started"
        payload:
          type: string
          example: "{\"round\":1}"
        judge_id:
          type: string
          example: "judge-1"
        created_at:
          type: string
          format: date-time

    Ruleset:
      type: object
      properties:
        id:
          type: string
          example: "ipsi-2024"
        name:
          type: string
          example: "IPSI 2024"
        version:
          type: string
          example: "2024.1"
        scoring:
          type: object
          description: Konfigurasi poin teknik, bantingan, durasi ronde, dan batas penalti
        status:
          type: string
          example: "active"
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45