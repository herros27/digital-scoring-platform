        dikembalikan: tidak ada NIK, tanggal lahir, berat badan, berkas, maupun ID atlet/peserta.
        `is_winner` menandai slot yang memenangkan partainya. `404` bila kejuaraan tidak aktif, kategori
        bukan milik kejuaraan itu, atau kategori belum punya bagan.
