      summary: Muat dan Aktifkan Match ke Arena Tertentu (Admin / Dewan / Wasit)
      description: |
        Menginisialisasi Match Orchestrator, Rules Engine, Timer, dan mengubah status match menjadi READY.
        Jika arena sedang aktif menjalankan pertandingan lain, akan mengembalikan error 409 ARENA_BUSY.
      tags:
        - Match
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arena_id]
              properties:
                arena_id:
                  type: string
                  format: uuid
                ruleset_path:
                  type: string
                  default: "ipsi"
                  example: "ipsi"
      responses:
        '200':
          description: Match siap di arena
        '409':
          description: Arena sedang dipakai oleh pertandingan lain yang aktif (ARENA_BUSY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/competitions/{comp_id}/matches/{id}/start:
    post:
      summary: Mulai Pertandingan / Ronde (Admin / Dewan / Wasit)
      description: |
        Partai harus sudah dimuat ke gelanggang (`load-arena`). Status partai di database menjadi `running`
        (`started_at` terisi). Memulai partai yang sudah berjalan, selesai, atau dibatalkan → 400
        `INVALID_STATE_TRANSITION`.

        **Pembatasan gelanggang (berlaku untuk semua aksi kontrol: load-arena, start, pause, resume, finish,
        outcome, cancel, reschedule):** token PIN wasit terikat ke satu gelanggang dan hanya boleh mengontrol partai
        di gelanggangnya (`403` bila berbeda), sama seperti handshake WebSocket. Login email admin/dewan/wasit tidak
        terikat gelanggang.
      tags:
        - Match Lifecycle
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pertandingan dimulai (status running)

  /api/v1/competitions/{comp_id}/matches/{id}/pause:
