      responses:
        '200':
          description: Daftar (kosong bila tidak ada pertandingan berlangsung)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        arena_id: { type: string, format: uuid }
                        arena_name: { type: string }
                        match_id: { type: string, format: uuid }
                        state: { type: string, example: round_1 }
                        round: { type: integer }
                        red_athlete: { type: string }
                        blue_athlete: { type: string }
                        red_total: { type: integer }
                        blue_total: { type: integer }

