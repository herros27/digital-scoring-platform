  # -------------------------------------------------------
  /api/v1/rulesets:
    get:
      summary: Daftar Ruleset Pertandingan (IPSI 2024, PERSILAT, dll)
      tags:
        - Ruleset
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar ruleset yang tersedia di sistem
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ruleset'
    post:
      summary: Buat Ruleset Pertandingan Baru (Admin / Dewan)
      description: Membuat aturan scoring kustom secara dinamis tanpa mengubah kode sumber atau me-restart server.
      tags:
        - Ruleset
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - version
                - scoring
              properties:
                name:
                  type: string
                  example: "Kejurda Remaja 2026"
                version:
                  type: string
                  example: "1.0"
                scoring:
                  type: object
                  properties:
                    technique_points:
                      type: integer
                      example: 1
                    knockdown_points:
                      type: integer
                      example: 2
                    fall_points:
                      type: integer
                      example: 3
                    max_penalties:
                      type: integer
                      example: 3
                    penalty_threshold:
                      type: integer
                      example: 1
                    round_duration:
                      type: integer
                      description: Durasi ronde dalam detik
                      example: 90
                    break_duration:
                      type: integer
                      description: Durasi istirahat dalam detik
                      example: 45
                    total_rounds:
                      type: integer
                      example: 3
                    techniques:
                      type: array
                      description: |
                        Teknik yang dinilai juri (`type` = `score_type` pada `judge_input`). Kosong = diturunkan dari
                        `technique_points`/`knockdown_points`/`fall_points` (Pukulan, Tendangan, Jatuhan).
                        Kode `undo` dan `penalty` dicadangkan sistem.
                      items:
                        type: object
                        required: [type, label, points]
                        properties:
                          type: { type: string, example: catch_fall, description: "huruf kecil/angka/underscore" }
                          label: { type: string, example: "Tangkapan + Jatuhan" }
                          points: { type: integer, minimum: 1, example: 4 }
                    penalties:
                      type: array
                      description: |
                        Tabel sanksi. Kosong = bawaan: Binaan 1-2 (0), Teguran 1 (-1), Teguran 2 (-2),
                        Peringatan 1 (-5), Peringatan 2 (-10), Peringatan 3 (diskualifikasi).
                      items:
                        type: object
                        required: [type, label]
                        properties:
                          type: { type: string, example: teguran_2 }
                          label: { type: string, example: "Teguran 2" }
                          points: { type: integer, minimum: 0, example: 2, description: "Potongan nilai bagi sudut yang dikenai" }
                          action:
                            type: string
                            enum: [disqualify]
                            description: "`disqualify` = sanksi ini langsung mendiskualifikasi sudut yang dikenai"
                    outcomes:
                      type: array
                      description: |
                        Hasil khusus yang dapat dinyatakan wasit. Kosong = bawaan: `ko` (in_match), `tko` (in_match),
                        `walkover` (before_start), `withdrawal` (any).
                      items:
                        type: object
                        required: [type, label, phase]
                        properties:
                          type: { type: string, enum: [ko, tko, walkover, withdrawal] }
                          label: { type: string, example: "Menang Teknik (TKO)" }
                          phase: { type: string, enum: [before_start, in_match, any] }
                    tiebreak:
                      type: object
                      description: |
                        Aturan seri. Kosong = sanksi paling sedikit, lalu teknik terbanyak (urut dari nilai tertinggi),
                        lalu keputusan manual wasit.
                      properties:
                        steps:
                          type: array
                          items: { type: string, enum: [fewest_penalties, technique_priority] }
                          description: Langkah otomatis, dijalankan berurutan sampai ada pemenang
                        technique_priority:
                          type: array
                          items: { type: string }
                          description: Kode teknik dari yang paling bernilai (default dari nilai poin teknik, besar ke kecil)
                        manual_methods:
                          type: array
                          items: { type: string, enum: [extra_round, lighter_weight, coin_toss] }
                          description: Dasar keputusan manual yang boleh dipilih wasit bila semua langkah otomatis seri
                    consensus:
                      type: object
                      description: Aturan kesepakatan juri. Kosong = 3 juri, mayoritas 2, window 3000 ms.
                      properties:
                        judges: { type: integer, minimum: 1, maximum: 5, example: 3 }
                        majority: { type: integer, minimum: 1, example: 2, description: "Jumlah juri yang harus sepakat (<= judges)" }
                        window_ms: { type: integer, minimum: 500, maximum: 10000, example: 3000 }
                status:
                  type: string
                  example: "active"
      responses:
        '201':
          description: Ruleset berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Ruleset'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

