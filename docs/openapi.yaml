          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List peserta kompetisi
    post:
      summary: Daftarkan Atlet ke Kompetisi & Kelas Berat (Admin / Dewan)
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                  format: uuid
                  description: Kosongkan jika membuat atlet baru sekaligus
                name:
                  type: string
                  example: "Budi Santoso"
                gender:
                  type: string
                  enum: [male, female]
                  example: "male"
                team:
                  type: string
                  example: "Jawa Barat"
                birth_date:
                  type: string
