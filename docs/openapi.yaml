  # -------------------------------------------------------
  /api/v1/competitions/{comp_id}/matches:
    get:
      summary: Daftar Pertandingan pada Kompetisi (Mendukung Pagination, Filter Status & Gelanggang)
      description: |
        Tanpa `arena_id`: terbaru lebih dulu. Dengan `arena_id`: antrean partai gelanggang itu, urut dari
        yang paling awal dibuat (dipakai konsol wasit untuk menampilkan antrean).
      tags:
        - Match
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: arena_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Hanya partai pada gelanggang ini (urutan antrean)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Nomor halaman (dimulai dari 1)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Jumlah data per halaman (maksimal 100)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, ready, running, paused, finished, cancelled]
          description: Filter berdasarkan status pertandingan
      responses:
        '200':
          description: List pertandingan berhasil diambil beserta metadata pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        competition_id:
                          type: string
                          format: uuid
                        arena_id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          example: "running"
                        round:
                          type: integer
                          example: 1
                  pagination:
                    $ref: '#/components/schemas/Pagination'
