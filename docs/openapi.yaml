      summary: Buat Partai Pertandingan Baru (Admin / Dewan)
      tags:
        - Match
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [athlete_red_id, athlete_blue_id]
              properties:
                arena_id:
                  type: string
                  format: uuid
                bracket_slot_id:
                  type: string
                  format: uuid
                athlete_red_id:
                  type: string
                  format: uuid
                athlete_blue_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Match dibuat

