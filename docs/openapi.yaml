  /api/v1/competitions/{comp_id}/participants:
    get:
      summary: Daftar Peserta Kompetisi beserta Status Verifikasi (pending/verified/rejected/overweight/underweight). Peran contingent hanya menerima peserta yang ia daftarkan sendiri. Peserta berkategori diberi `age_check` (`missing_birth_date` | `age_mismatch`) bila umurnya belum bisa dipastikan/tidak sesuai golongan; verifikasi `verified` ditolak (400) selama tanda itu ada
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter status ('pending', 'verified', 'rejected')
          schema:
            type: string
      responses:
        '200':
          description: Daftar peserta kompetisi

  /api/v1/competitions/{comp_id}/participants/{id}/verify:
    put:
      summary: Verifikasi Pendaftaran Atlet oleh Admin / Dewan (Timbang Badan & Berkas)
      description: |
        Mengubah status pendaftaran peserta menjadi 'verified' atau 'rejected'.

        Aturan resmi PB IPSI untuk peserta yang terhubung ke kategori:
        - **Tanpa toleransi bobot (0 kg)**: jika `actual_weight` di luar rentang kategori, status akhir
          menjadi `overweight` / `underweight` walau diminta `verified` (lihat `reason`).
        - Kategori ber-batas bobot mewajibkan `actual_weight` (atau nilai tersimpan sebelumnya) untuk `verified`.
        - Berkas wajib (`docs_verified`) sesuai regulasi PB IPSI 2025 / IPSF-PERSILAT 2026: `identity`
          (bukti umur) dan `health` (surat sehat) untuk semua atlet, ditambah `pregnancy` (pernyataan
          tidak hamil) bagi putri Remaja & Dewasa; jika belum lengkap, 400. `parental` (izin orang tua)
          opsional dan tidak memblokir verifikasi.
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [verified, rejected]
                  example: "verified"
                actual_weight:
                  type: number
                  description: Hasil timbang aktual (kg), > 0 dan <= 300.
                  example: 27.5
                docs_verified:
                  type: object
                  additionalProperties:
                    type: boolean
                  description: "Checklist berkas: identity (bukti umur), health (surat sehat), pregnancy (tidak hamil, putri Remaja/Dewasa), parental (opsional)."
                  example: { identity: true, health: true }
      responses:
        '200':
          description: |
            Status verifikasi berhasil diperbarui. Field `status` berisi status akhir
            (verified / rejected / overweight / underweight) dan `reason` berisi alasan bila gagal timbang.

