      summary: Daftar Gelanggang yang Sedang Berlangsung (Publik)
      description: |
        Semua gelanggang yang punya pertandingan aktif (state bukan `finished`/`cancelled`), dibaca dari
        orchestrator di memori dan diurutkan menurut nama gelanggang. Dipakai halaman `/scoreboard`.
      tags:
