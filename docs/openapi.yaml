openapi: 3.0.3
info:
  title: Pencak Silat Digital Scoring System API
  description: |
    API Backend untuk Digital Scoring Pencak Silat (Kategori Tanding).
    Mendukung Real-Time WebSocket Scoring, Konsensus Juri, Manajemen Gelanggang (Arena),
    Bagan Turnamen (Single Elimination), Kontrak Protokol WebSocket, dan Event Sourcing Audit Trail.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  # -------------------------------------------------------
  # AUTHENTICATION
  # -------------------------------------------------------
  /api/v1/auth/judge-login:
    post:
      summary: Login Tablet Juri / Wasit menggunakan PIN
      description: |
        Login hanya dengan PIN. Turnamen, gelanggang, role, dan kursi ditentukan server dari data PIN
        (setiap PIN unik di seluruh sistem). PIN juri 6 digit, PIN wasit 8 digit. Mengembalikan token JWT
        untuk koneksi WebSocket. Setelah 5 kali PIN salah beruntun dalam 15 menit, IP klien dikunci 15 menit
        (HTTP 429 `TOO_MANY_ATTEMPTS` dengan header `Retry-After`).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: '^[0-9]{6,8}$'
                  example: "123001"
      responses:
        '200':
          description: Login berhasil, token JWT diberikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      role:
                        type: string
                        example: "judge"
                      seat_number:
                        type: integer
                        example: 1
                      arena_id:
                        type: string
                        format: uuid
                      competition_id:
                        type: string
                        format: uuid
        '401':
          description: PIN salah atau kadaluarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Terlalu banyak PIN salah beruntun; IP dikunci sementara (lihat header `Retry-After`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Login Admin / Operator / Dewan menggunakan Email & Password
      description: Mengautentikasi akun admin/operator dan mengembalikan token JWT untuk akses API administratif.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@silat.id"
                password:
                  type: string
                  format: password
                  example: "AdminSecret123!"
      responses:
        '200':
          description: Login berhasil, token JWT diberikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        $ref: '#/components/schemas/Official'
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/contingent/register:
    post:
      summary: Registrasi Akun Manajer Kontingen / Official Tim
      description: Memungkinkan perwakilan kontingen/perguruan mendaftar secara mandiri untuk mengelola pendaftaran atlet mereka.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pic_name, email, phone, password]
              properties:
                name:
                  type: string
                  example: "Tapak Suci Sleman"
                pic_name:
                  type: string
                  example: "Budi Santoso"
                email:
                  type: string
                  format: email
                  example: "tapaksuci@example.com"
                phone:
                  type: string
                  example: "081234567890"
                password:
                  type: string
                  format: password
                  example: "Secret123!"
      responses:
        '201':
          description: Kontingen berhasil terdaftar
        '400':
          description: Validasi gagal atau email sudah terdaftar

  /api/v1/auth/contingent/login:
    post:
      summary: Login Manajer Kontingen
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "tapaksuci@example.com"
                password:
                  type: string
                  format: password
                  example: "Secret123!"
      responses:
        '200':
          description: Login berhasil, token JWT role 'contingent' dikembalikan
        '401':
          description: Email atau password salah

  /api/v1/auth/logout:
    post:
      summary: Logout Sesi Pengguna
      description: Konfirmasi logout dari server. Pada arsitektur Stateless JWT, klien wajib menghapus token dari storage lokal.
      tags:
        - Authentication
      responses:
        '200':
          description: Berhasil logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "OK"
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "successfully logged out"

  /api/v1/auth/create-pin:
    post:
      summary: Generate PIN Baru untuk Petugas Pertandingan (Admin / Dewan)
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competition_id, arena_id, role]
              properties:
                competition_id:
                  type: string
                  format: uuid
                arena_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [judge, referee, admin, dewan, operator, judge_1, judge_2, judge_3]
                  example: "judge"
                seat_number:
                  type: integer
                  description: Optional. Nomor kursi juri di gelanggang (1, 2, 3, dst).
                  example: 1
                pin:
                  type: string
                  description: Optional. Jika tidak diisi, server membuat PIN acak yang unik (6 digit; 8 digit untuk role wasit). PIN kustom harus berupa angka dengan panjang sesuai role dan unik di seluruh sistem; bila bentrok server menjawab HTTP 409 `PIN_TAKEN`.
                  example: "839201"
                ttl_hours:
                  type: integer
                  default: 12
                  example: 12
      responses:
        '200':
          description: PIN berhasil dibuat (mengembalikan plaintext PIN yang di-generate server dan masa berlaku)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      competition_id:
                        type: string
                        format: uuid
                      arena_id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        example: "judge"
                      seat_number:
                        type: integer
                        example: 1
                      pin:
                        type: string
                        example: "839201"
                      expires_at:
                        type: string
                        format: date-time
        '403':
          description: Forbidden (Hanya admin/dewan yang diizinkan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/pins:
    get:
      summary: Mengambil Daftar PIN Aktif per Gelanggang (Admin / Dewan)
      description: Mengambil seluruh PIN aktif untuk gelanggang tertentu secara sinkron dari database. Jika arena belum memiliki PIN, server akan otomatis men-generate PIN awal untuk 5 Juri dan 1 Wasit.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: competition_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID kompetisi yang aktif
        - name: arena_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID gelanggang yang dipilih
      responses:
        '200':
          description: Daftar PIN juri dan wasit aktif berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        competition_id:
                          type: string
                          format: uuid
                        arena_id:
                          type: string
                          format: uuid
                        role:
                          type: string
                          example: "judge"
                        seat_number:
                          type: integer
                          example: 1
                        pin:
                          type: string
                          example: "703351"
                        expires_at:
                          type: string
                          format: date-time
        '400':
          description: Bad Request (competition_id atau arena_id tidak disertakan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Hanya admin atau dewan yang berwenang)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------
  # COMPETITIONS
  # -------------------------------------------------------
  /api/v1/competitions:
    get:
      summary: Daftar Seluruh Kejuaraan (Mendukung Pagination & Filter Status)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Nomor halaman (dimulai dari 1)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Jumlah data per halaman (maksimal 100)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [upcoming, ongoing, completed]
          description: Filter berdasarkan status kompetisi
      responses:
        '200':
          description: List kompetisi berhasil diambil beserta metadata pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: "Kejuaraan Nasional Silat 2026"
                        location:
                          type: string
                          example: "Jakarta"
                        status:
                          type: string
                          example: "ongoing"
                        ruleset_name:
                          type: string
                          example: "IPSI 2024"
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Buat Kejuaraan Baru (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location, start_date, end_date, ruleset_name]
              properties:
                name:
                  type: string
                  example: "Kejuaraan Nasional Silat 2026"
                location:
                  type: string
                  example: "Jakarta"
                start_date:
                  type: string
                  format: date
                  example: "2026-10-01"
                end_date:
                  type: string
                  format: date
                  example: "2026-10-05"
                ruleset_name:
                  type: string
                  example: "IPSI 2024"
      responses:
        '201':
          description: Kompetisi dibuat

  /api/v1/competitions/{id}:
    get:
      summary: Detail Kejuaraan
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail kompetisi
    put:
      summary: Perbarui Data Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Kejuaraan Nasional Silat Edisi Khusus 2026"
                location:
                  type: string
                  example: "Bandung"
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                ruleset_name:
                  type: string
      responses:
        '200':
          description: Data kompetisi berhasil diperbarui

  /api/v1/competitions/{id}/activate:
    put:
      summary: Aktifkan Status Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi active

  /api/v1/competitions/{id}/pause:
    post:
      summary: Jeda Status Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi paused

  /api/v1/competitions/{id}/finish:
    post:
      summary: Selesaikan Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi completed

  /api/v1/competitions/{id}/cancel:
    post:
      summary: Batalkan Kejuaraan (Admin / Dewan)
      tags:
        - Competition
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status diubah menjadi cancelled

  # -------------------------------------------------------
  # CATEGORIES
  # -------------------------------------------------------
  /api/v1/competitions/{comp_id}/categories:
    get:
      summary: Daftar Kategori Pertandingan pada Kompetisi
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List kategori tanding
    post:
      summary: Tambah Kategori Pertandingan Baru (Admin / Dewan)
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gender, weight_class]
              properties:
                name:
                  type: string
                  example: "Tanding Putra Kelas A"
                gender:
                  type: string
                  enum: [male, female]
                  example: "male"
                weight_class:
                  type: string
                  example: "A"
                ruleset_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Kategori tanding berhasil dibuat

  /api/v1/competitions/{comp_id}/categories/{id}:
    get:
      summary: Detail Kategori Pertandingan
      tags:
        - Category
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail kategori pertandingan

  # -------------------------------------------------------
  # ATHLETES & PARTICIPANTS
  # -------------------------------------------------------
  /api/v1/athletes:
    get:
      summary: Daftar Master Seluruh Atlet (Mendukung Pagination & Filter Gender)
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Nomor halaman (dimulai dari 1)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Jumlah data per halaman (maksimal 100)
        - name: gender
          in: query
          required: false
          schema:
            type: string
            enum: [male, female]
          description: Filter berdasarkan gender atlet
      responses:
        '200':
          description: List seluruh atlet berhasil diambil beserta metadata pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: "Budi Santoso"
                        gender:
                          type: string
                          example: "male"
                        team:
                          type: string
                          example: "Jawa Barat"
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Tambah Master Atlet Baru (Admin / Dewan)
      tags:
        - Athlete
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gender, team]
              properties:
                name:
                  type: string
                  example: "Budi Santoso"
                gender:
                  type: string
                  enum: [male, female]
                  example: "male"
                team:
                  type: string
                  example: "Jawa Barat"
      responses:
        '201':
          description: Atlet berhasil ditambahkan

  /api/v1/athletes/{id}:
    get:
      summary: Detail Data Atlet
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail data atlet

  /api/v1/competitions/{comp_id}/athletes:
    get:
      summary: Daftar Peserta / Atlet yang Terdaftar pada Kompetisi
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List peserta kompetisi
    post:
      summary: Daftarkan Atlet ke Kompetisi & Kelas Berat (Admin / Dewan)
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                  format: uuid
                  description: Kosongkan jika membuat atlet baru sekaligus
                name:
                  type: string
                  example: "Budi Santoso"
                gender:
                  type: string
                  enum: [male, female]
                  example: "male"
                team:
                  type: string
                  example: "Jawa Barat"
                weight_class:
                  type: string
                  example: "A"
      responses:
        '201':
          description: Atlet berhasil didaftarkan ke kompetisi

  /api/v1/competitions/{comp_id}/participants:
    get:
      summary: Daftar Peserta Kompetisi beserta Status Verifikasi (pending/verified/rejected)
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter status ('pending', 'verified', 'rejected')
          schema:
            type: string
      responses:
        '200':
          description: Daftar peserta kompetisi

  /api/v1/competitions/{comp_id}/participants/{id}/verify:
    put:
      summary: Verifikasi Pendaftaran Atlet oleh Admin / Dewan (Timbang Badan & Berkas)
      description: Mengubah status pendaftaran peserta menjadi 'verified' atau 'rejected'.
      tags:
        - Athlete
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [verified, rejected]
                  example: "verified"
      responses:
        '200':
          description: Status verifikasi berhasil diperbarui

  /api/v1/contingents:
    get:
      summary: Daftar Kontingen Terdaftar (Admin / Dewan)
      tags:
        - Contingent
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List seluruh kontingen

  /api/v1/contingents/{id}:
    get:
      summary: Detail Data Kontingen
      tags:
        - Contingent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail data kontingen

  # -------------------------------------------------------
  # ARENAS
  # -------------------------------------------------------
  /api/v1/competitions/{comp_id}/arenas:
    get:
      summary: Daftar Gelanggang / Arena pada Kompetisi
      tags:
        - Arena
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List gelanggang
    post:
      summary: Tambah Gelanggang Baru (Admin / Dewan)
      tags:
        - Arena
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Gelanggang A"
      responses:
        '201':
          description: Gelanggang berhasil ditambahkan

  /api/v1/competitions/{comp_id}/arenas/{id}:
    get:
      summary: Detail Gelanggang / Arena
      tags:
        - Arena
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Data gelanggang berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      competition_id:
                        type: string
                        format: uuid
                      name:
                        type: string
                        example: "Gelanggang A"
                      created_at:
                        type: string
                        format: date-time
    put:
      summary: Perbarui Data Gelanggang (Admin / Dewan)
      tags:
        - Arena
      security:
        - BearerAuth: []
      parameters:
        - name: comp_id
