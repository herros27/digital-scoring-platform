name: CI Pipeline

on:
  push:
    branches: [main, master, dev, dev-frontend]
  pull_request:
    branches: [main, master, dev, dev-frontend]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    # Tes login PIN (tests/pin_login_test.go) memakai database nyata; tanpa service ini tes dilewati.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: digital_scoring
          POSTGRES_USER: scoring_user
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoring_user -d digital_scoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgres://scoring_user@localhost:5432/digital_scoring?sslmode=disable
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted according to gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -v ./cmd/server

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Build Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: digital-scoring:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Web Image (frontend + nginx)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          load: true
          tags: digital-scoring-web:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # `app` adalah nama layanan backend pada docker compose; nginx meresolusinya saat memuat konfigurasi
      - name: Validate nginx Config
        run: docker run --rm --add-host app:127.0.0.1 digital-scoring-web:test nginx -t
