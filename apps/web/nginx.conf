# Menyajikan SPA Vue dan meneruskan API/WebSocket ke backend Go (layanan `app` pada docker compose).
# Port 80: Pintu LAN/Venue (tablet juri, konsol wasit, scoreboard lokal).
# Port 8082: Pintu Publik (khusus Cloudflare Tunnel, jalur operasional dan Swagger ditutup).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pembatas sambungan bersama untuk koneksi WebSocket penonton publik
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# ==============================================================================
# 1. Pintu Masuk Lokal (Port 80): Jaringan Venue / LAN / Loopback
# ==============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Di belakang Caddy (profil https) alamat sambungan adalah kontainer Caddy, bukan klien.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # WebSocket: matikan access_log agar token juri/wasit di query parameter tidak bocor ke log
    location /ws/ {
        access_log off;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dokumentasi API (Swagger UI + openapi.yaml) milik backend (lokal saja)
    location /docs {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
    }

    # Berkas bernama hash dari Vite: cache panjang
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manifest PWA: tipe MIME yang benar dan selalu diperiksa ulang oleh peramban
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: rute klien (/judge, /referee, /scoreboard/..., /ops) jatuh ke index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ==============================================================================
# 2. Pintu Masuk Publik (Port 8082): Cloudflare Tunnel (skor.<domain>)
# ==============================================================================
server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Real IP dari Cloudflare Tunnel (cloudflared container di jaringan Docker 172.16.0.0/12)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   CF-Connecting-IP;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Header keamanan publik (di-include ulang di location yang punya add_header sendiri)
    include /etc/nginx/snippets/security-headers.conf;

    # Jalur API operasional dilarang keras diakses dari publik
    location ~ ^/api/v1/(auth/login|auth/judge-login|auth/create-pin|auth/pins|officials|contingents/[^/]+/password) {
        return 404;
    }

    # Jalur UI tablet juri dan konsol wasit tidak boleh dijangkau dari publik
    location ~ ^/(judge|referee) {
        return 404;
    }

    # Dokumentasi Swagger dan Endpoint Metrik Prometheus ditutup dari internet
    location /docs {
        return 404;
    }
    location /metrics {
        return 404;
    }

    # WebSocket Publik: Hanya untuk penonton (tanpa token), dibatasi 20 koneksi per IP
    location /ws/ {
        if ($arg_token) {
            return 403;
        }
        limit_conn ws_per_ip 20;
        access_log off;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Jalur API publik (live scoreboard, jadwal, bagan, registrasi/login kontingen, manajemen atlet)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Berkas statis Vite
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Manifest PWA
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA Fallback untuk penonton dan manajer kontingen
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
