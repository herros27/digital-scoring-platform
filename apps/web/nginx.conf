# Menyajikan SPA Vue dan meneruskan API/WebSocket ke backend Go (layanan `app` pada docker compose).
# Satu pintu masuk: tablet juri, konsol wasit, scoreboard, dan panel operasi cukup membuka http://<host>/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # IP klien yang dilihat backend (pembatas percobaan PIN) selalu alamat sambungan asli:
    # header X-Forwarded-For dari klien ditimpa, bukan ditambah, agar tidak bisa dipalsukan.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # WebSocket: sambungan panjang selama event berlangsung
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dokumentasi API (Swagger UI + openapi.yaml) milik backend
    location /docs {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
    }

    # Berkas bernama hash dari Vite: cache panjang
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: rute klien (/judge, /referee, /scoreboard/..., /ops) jatuh ke index.html; index tidak di-cache
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
